openapi: 3.2.0
info:
  title: Publisher Authentication Token API
  version: '1.0'
  description: Authorization token
servers:
- url: https://api.openweb.com
tags:
- name: Token
  description: Authorization token
paths:
  /v1/publisher/auth:
    parameters: []
    post:
      summary: Request an OpenWeb API token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: 'JWT token required for API authentication.


                      **NOTE**: JWT tokens have a 24-hour validity period. And this endpoint enforces a rate limit of 1 request per second per IP address.'
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              required:
              - spot_id
              - apikey
              properties:
                spot_id:
                  type: string
                  description: 'Unique OpenWeb identifier for your property


                    If you do not know your OpenWeb spot ID, please contact your OpenWeb representative.'
                apikey:
                  type: string
                  description: 'Unique OpenWeb token


                    Follow these steps to retrieve the API key:

                    1. From your OpenWeb Admin Panel, click **Settings**.

                    2. Under **Authentication Tokens**, click **Get Export v4 API key** to reveal the API Key.

                    3. Copy the **Export v4 API key** value.'
      description: Generates a JWT token to be used for OpenWeb API
      tags:
      - Token
      operationId: postV1PublisherAuth
      x-operation-id-source: derived
