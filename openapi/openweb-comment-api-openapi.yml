- name: Comment
  description: SEO related to a comment
paths:
  /comment/{spot_id}/{post_id}:
    parameters:
    - $ref: '#/components/parameters/spot_id'
    - $ref: '#/components/parameters/post_id'
    post:
      summary: Create comment SEO markup
      operationId: post-comment
      responses:
        '200':
          description: OK
      description: Returns the SEO markup used by Google and other search engines to index your comments
      tags:
      - Comment
      parameters:
      - $ref: '#/components/parameters/json'
components:
  parameters:
    spot_id:
      name: spot_id
      in: path
      required: true
      schema:
        type: string
      description: Unique OpenWeb identifier
    json:
      name: json
      in: query
      required: false
      schema:
        type: boolean
        example: true
      description: Formats response into a JSON structure
    post_id:
      name: post_id
      in: path
      required: true
      schema:
        type: string
      description: 'Unique article identifier that is specific to the article page


        The ideal post ID has the following characteristics:

        - Aligns with the URL slug (`an-article-title`) or article ID (`14325`)

        - Is **less than 50 characters**, ideally 15 characters

        - Uses a combination of letters, numbers, dashes (-), or hyphens (_)

        - Except for the regex `[^\w\s\-\:\.\$\~]`, does not include special characters

        '
