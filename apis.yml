  description: >-
    JWT-authenticated REST API for publishers on the OpenWeb platform: request an
    API token, export comments/users/ranks (v2 and v4), retrieve top comments and
    trending articles, manage SSO users (register, retrieve, update, delete),
    generate SEO markup, and read or set article moderation policy.
