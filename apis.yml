aid: openweb

name: OpenWeb

description: OpenWeb (formerly Spot.IM) is a community and audience-engagement platform for publishers, delivering OpenWebOS — a unified, end-to-end
  suite for building community, harnessing first-party data, and driving sustainable revenue. Its developer platform exposes a JWT-authenticated
  Publisher API (comment export, top comments, trending articles, SSO user management, moderation policy, and SEO markup services) at api.openweb.com,
  a notification webhook surface, and web, Android, iOS, and React Native SDKs for embedding Conversation, Reactions, Community Spotlight, Live
  Blog, and Standalone Ad experiences. Backed by Insight Partners.

